name: 🎁 Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: ID of the GitHub workflow run to ship
        required: true
      publish_nuget:
        description: Push NuGet packages
        required: false
        default: true
        type: boolean
      publish_npm:
        description: Push NPM packages
        required: false
        default: true
        type: boolean
      publish_crates:
        description: Push Rust crates
        required: false
        default: true
        type: boolean
      publish_java:
        description: Push Maven Central artifacts and Gradle plugin
        required: false
        default: true
        type: boolean

run-name: ${{ github.ref_name }}

jobs:
  release:
    runs-on: windows-2025
    environment: Publishing
    env:
      AZURE_CORE_OUTPUT: none
    permissions:
      actions: read # Required to download artifacts
      contents: write # Upload artifacts to Release
      id-token: write # Required for Azure and NuGet OIDC authentication
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: 🔎 Search for build of ${{ github.ref }}
      shell: pwsh
      id: findrunid
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true

        if ('${{ inputs.ship_run_id }}') {
          $runid = '${{ inputs.ship_run_id }}'
        } else {
          $restApiRoot = '/repos/${{ github.repository }}'

          # Resolve the tag reference to a commit sha
          $resolvedRef = gh api `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            $restApiRoot/git/ref/tags/${{ github.ref_name }} `
            | ConvertFrom-Json
          $commitSha = $resolvedRef.object.sha

          Write-Host "Resolved ${{ github.ref_name }} to $commitSha"

          $releases = @(gh run list -R ${{ github.repository }} -c $commitSha -w .github/workflows/build.yml -s success --json databaseId,startedAt,event,headBranch `
            | ConvertFrom-Json | Sort-Object startedAt -Descending)

          $preferredReleases = $releases | Where-Object {
            $_.event -eq 'push' -and ($_.headBranch -eq 'main' -or $_.headBranch -eq 'develop' -or $_.headBranch -match '^v\d+(?:\.\d+)?$')
          }

          if ($releases.length -eq 0) {
            Write-Error "No successful builds found for ${{ github.ref }}."
          } else {
            if ($preferredReleases.length -gt 0) {
              $selectedReleases = $preferredReleases
              $multipleRunsWarning = "More than one successful run found for ${{ github.ref }}. Preferring the most recent push build from a public-release branch."
            } else {
              $selectedReleases = $releases
              $multipleRunsWarning = "More than one successful run found for ${{ github.ref }} and none were from a public-release branch. Artifacts from the most recent successful run will ship."
            }

            if ($releases.length -gt 1) {
              Write-Warning $multipleRunsWarning
            }

            $runid = $selectedReleases[0].databaseId
          }
        }

        Write-Host "Using artifacts from run-id: $runid"

        Echo "runid=$runid" >> $env:GITHUB_OUTPUT

    - name: 🔻 Download deployables artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: deployables-Linux
        path: ${{ runner.temp }}/deployables
        run-id: ${{ steps.findrunid.outputs.runid }}
        github-token: ${{ github.token }}

    - name: 🔻 Download ecosystem packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ecosystem-deployables
        path: ${{ runner.temp }}/deployables/ecosystems
        run-id: ${{ steps.findrunid.outputs.runid }}
        github-token: ${{ github.token }}

    - name: Plan Java publication and validate prerequisites
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_java }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $buildSha = gh run view '${{ steps.findrunid.outputs.runid }}' --repo '${{ github.repository }}' --json headSha --jq .headSha
        $checkoutSha = git rev-parse HEAD
        if ($buildSha -ne $checkoutSha) {
          throw 'Java publication must use the same commit as the selected verified build. Dispatch this workflow on that commit or release tag.'
        }
        $packages = Get-Content '${{ runner.temp }}/deployables/ecosystems/packages.json' -Raw | ConvertFrom-Json
        if ($packages.version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$' -or $packages.version -match '(?i)SNAPSHOT|(?:^|[.-])g[0-9a-f]{7,}$') {
          throw "Refusing to publish Java integration version '$($packages.version)'."
        }
        "JAVA_INTEGRATION_VERSION=$($packages.version)" >> $env:GITHUB_ENV
        $submitted = git tag --list "java/v$($packages.version)"
        if ($submitted) {
          'PUBLISH_JAVA_CENTRAL=false' >> $env:GITHUB_ENV
          'PUBLISH_JAVA_PLUGIN=false' >> $env:GITHUB_ENV
          'RECORD_JAVA_SUBMISSION=false' >> $env:GITHUB_ENV
          Write-Host "Java $($packages.version) was already submitted; skipping both registries."
        } else {
          $javaArchive = Join-Path '${{ runner.temp }}/deployables/ecosystems/java' "nbgv-java-maven-repository-$($packages.version).zip"
          $javaRepository = Join-Path '${{ runner.temp }}' 'nbgv-java-maven-repository'
          Expand-Archive -LiteralPath $javaArchive -DestinationPath $javaRepository
          $plan = ./tools/Get-JavaPublicationPlan.ps1 -Version $packages.version -ArtifactDirectory $javaRepository
          "JAVA_CENTRAL_TASKS=$($plan.CentralTasks -join ' ')" >> $env:GITHUB_ENV
          "PUBLISH_JAVA_CENTRAL=$($plan.CentralTasks.Count -gt 0)" >> $env:GITHUB_ENV
          "PUBLISH_JAVA_PLUGIN=$($plan.PublishPlugin)" >> $env:GITHUB_ENV
          'RECORD_JAVA_SUBMISSION=true' >> $env:GITHUB_ENV
          $required = @()
          if ($plan.CentralTasks.Count -gt 0) { $required += @('MAVEN_CENTRAL_USERNAME', 'MAVEN_CENTRAL_PASSWORD') }
          if ($plan.PublishPlugin) { $required += @('GRADLE_PUBLISH_KEY', 'GRADLE_PUBLISH_SECRET') }
          if ($plan.CentralTasks.Count -gt 0 -or $plan.PublishPlugin) { $required += @('MAVEN_SIGNING_KEY', 'MAVEN_SIGNING_PASSWORD') }
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure $name in the Publishing environment before publishing Java packages."
            }
          }
        }

    - name: ⚙ Install .NET SDK
      shell: pwsh
      run: |
        ./tools/Install-DotNetSdk.ps1 -SdkOnly
        if ($LASTEXITCODE -ne 0) {
          throw "SDK installation failed."
        }

        dotnet tool restore
        if ($LASTEXITCODE -ne 0) {
          throw "dotnet tool restore failed."
        }

    - name: 🔐 Authenticate to Azure
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: ✍️ Sign NuGet packages
      shell: pwsh
      run: >
        dotnet tool run sign -- code azure-key-vault
        '*.nupkg'
        --base-directory '${{ runner.temp }}/deployables'
        --file-list '${{ github.workspace }}/.github/signfiles.txt'
        --recurse-containers
        --azure-key-vault-url '${{ vars.AZURE_KEY_VAULT_URL }}'
        --azure-key-vault-certificate '${{ vars.AZURE_KEY_VAULT_CERTIFICATE }}'
        --azure-credential-type azure-cli

    - name: Sign Windows Go executables
      shell: pwsh
      run: >
        dotnet tool run sign -- code azure-key-vault
        '*.exe'
        --base-directory '${{ runner.temp }}/deployables/ecosystems/go'
        --file-list '${{ github.workspace }}/.github/signfiles.txt'
        --azure-key-vault-url '${{ vars.AZURE_KEY_VAULT_URL }}'
        --azure-key-vault-certificate '${{ vars.AZURE_KEY_VAULT_CERTIFICATE }}'
        --azure-credential-type azure-cli

    - name: 🔎 Refresh ecosystem checksums
      shell: pwsh
      run: |
        $ecosystemPath = '${{ runner.temp }}/deployables/ecosystems'
        $checksumPath = Join-Path $ecosystemPath 'ecosystem-SHA256SUMS.txt'
        $files = Get-ChildItem $ecosystemPath -Recurse -File | Where-Object FullName -ne $checksumPath
        $duplicateNames = $files | Group-Object Name | Where-Object Count -gt 1
        if ($duplicateNames) {
         throw "Release asset names must be unique: $($duplicateNames.Name -join ', ')."
        }

        $files |
         Sort-Object Name |
         ForEach-Object {
           $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
           "$hash *$($_.Name)"
         } |
         Set-Content -Encoding ascii $checksumPath

    - name: 🪪 Authorize NuGet package push
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget-login
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_nuget }}
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: 🚀 Push NuGet packages
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_nuget }}
      run: dotnet nuget push ${{ runner.temp }}\deployables\*.nupkg --source https://api.nuget.org/v3/index.json -k '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_npm }}
      with:
        node-version: 26
        registry-url: https://registry.npmjs.org

    - name: 🚀 Push NPM packages
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_npm }}
      shell: pwsh
      run: |
        Get-ChildItem '${{ runner.temp }}/deployables/*.tgz' |% {
          $packageMetadata = tar -xOf $_.FullName package/package.json | ConvertFrom-Json
          Write-Host "Publishing NPM package $($packageMetadata.name)@$($packageMetadata.version) from $($_.Name)..."

          if ($packageMetadata.version -match '(^|[.-])g[0-9a-f]{7,}$') {
            throw "Refusing to publish non-public package version '$($packageMetadata.version)'. Release publishes must use a public-release build artifact."
          }

          $publishArgs = @($_.FullName, '--registry=https://registry.npmjs.org/')

          if ($packageMetadata.version -match '-(?<prerelease>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)') {
            $publishTag = $Matches.prerelease.Split('.')[0]
            Write-Host "Detected prerelease version $($packageMetadata.version). Publishing with dist-tag '$publishTag'."
            $publishArgs += "--tag=$publishTag"
          }

          npm publish @publishArgs
        }

    - name: 🔐 Authenticate to crates.io
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      id: crates-io-auth
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_crates }}

    - name: 🚀 Push Rust crates
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_crates }}
      working-directory: src/nerdbank-gitversioning-rs
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      run: |
        ../../tools/Set-CargoVersion.ps1
        cargo publish --workspace --allow-dirty

    - name: Install Java for publication
      if: ${{ env.PUBLISH_JAVA_CENTRAL == 'True' || env.PUBLISH_JAVA_PLUGIN == 'True' }}
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Gradle for publication
      if: ${{ env.PUBLISH_JAVA_CENTRAL == 'True' || env.PUBLISH_JAVA_PLUGIN == 'True' }}
      uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      with:
        gradle-version: '8.14.6'
        cache-disabled: true

    - name: Publish signed Java artifacts to Maven Central
      if: ${{ env.PUBLISH_JAVA_CENTRAL == 'True' }}
      working-directory: java
      shell: pwsh
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $tasks = $env:JAVA_CENTRAL_TASKS -split ' '
        gradle @tasks "-PintegrationVersion=$env:JAVA_INTEGRATION_VERSION" -PreleaseJava=true --no-daemon --no-configuration-cache --console=plain

    - name: Publish Gradle plugin to Plugin Portal
      if: ${{ env.PUBLISH_JAVA_PLUGIN == 'True' }}
      working-directory: java
      shell: pwsh
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        gradle :gradle-plugin:publishPlugins "-PintegrationVersion=$env:JAVA_INTEGRATION_VERSION" -PreleaseJava=true --no-daemon --no-configuration-cache --console=plain

    - name: Record successful Java publication submission
      if: ${{ env.RECORD_JAVA_SUBMISSION == 'true' }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $sha = git rev-parse HEAD
        gh api --method POST 'repos/${{ github.repository }}/git/refs' -f "ref=refs/tags/java/v$env:JAVA_INTEGRATION_VERSION" -f "sha=$sha"

    - name: 💽 Upload artifacts to release
      shell: pwsh
      if: ${{ github.event_name == 'release' && github.event.release.assets_url != '' }}
      continue-on-error: true # until we get this to work, be willing to skip it
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true

        Get-ChildItem '${{ runner.temp }}/deployables' -File -Recurse |% {
          Write-Host "Uploading $($_.Name) to release..."
          gh release -R ${{ github.repository }} upload "${{ github.ref_name }}" $_.FullName
        }
