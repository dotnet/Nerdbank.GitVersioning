[package]
name = "cargo-nbgv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Stage Cargo packages with native Nerdbank.GitVersioning versions"
readme = "../README.md"
documentation = "https://dotnet.github.io/Nerdbank.GitVersioning/docs/ecosystems/rust.html"
keywords = ["cargo", "git", "publish", "versioning"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
nerdbank-gitversioning.workspace = true
cargo_metadata = "0.19"
flate2 = "1.0"
serde_json.workspace = true
semver = "1.0"
tar = "0.4"
toml_edit = "0.22"

[dev-dependencies]
tempfile.workspace = true
git2 = { version = "0.21.0", default-features = false }
